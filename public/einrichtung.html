<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redekreis · Einrichtung</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2712%27 fill=%27none%27 stroke=%27%23e5a05c%27 stroke-width=%273%27/%3E%3Ccircle cx=%2716%27 cy=%274%27 r=%274%27 fill=%27%23e5a05c%27/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="seite-einrichtung">
  <form id="form" class="karte" autocomplete="off">
    <header>
      <h1>Redekreis</h1>
      <p class="lead">Das Mikrofon wandert. Die Mitschrift läuft lokal mit.</p>
    </header>

    <label class="feld">
      <span>Titel der Runde</span>
      <input id="titel" type="text" value="Redekreis" />
    </label>

    <label class="feld">
      <span>Mikrofon <em>das, was herumgereicht wird</em></span>
      <select id="mikro"><option value="">Standard</option></select>
    </label>

    <label class="feld feld-weit">
      <span>Wer sitzt im Kreis? <em>Eine Person pro Zeile, in der Reihenfolge des Kreises</em></span>
      <textarea id="namen" rows="7" placeholder="Anton&#10;Eva&#10;Timo"></textarea>
    </label>

    <label class="feld">
      <span>Redezeit <em>Minuten je Beitrag, 0 = ohne</em></span>
      <input id="redezeit" type="number" min="0" max="60" step="1" value="5" />
    </label>

    <label class="feld">
      <span>Sprache</span>
      <select id="sprache">
        <option value="de-DE" selected>Deutsch</option>
        <option value="en-US">Englisch (US)</option>
        <option value="en-GB">Englisch (GB)</option>
        <option value="fr-FR">Französisch</option>
        <option value="es-ES">Spanisch</option>
        <option value="it-IT">Italienisch</option>
        <option value="nl-NL">Niederländisch</option>
        <option value="pt-BR">Portugiesisch (BR)</option>
        <option value="ru-RU">Russisch</option>
        <option value="auto">automatisch erkennen</option>
      </select>
    </label>

    <label class="feld">
      <span>Verzögerung</span>
      <select id="latenz">
        <option value="13" selected>1,0 s — genauester Text</option>
        <option value="6">0,5 s</option>
        <option value="3">0,25 s</option>
        <option value="0">sofort — schnellster Text</option>
      </select>
    </label>

    <footer>
      <button id="los" class="gross" type="submit">Kreis eröffnen</button>
      <a id="zurueck" class="klein" href="/" hidden>Ohne Änderung zurück</a>
      <a class="klein" href="/archiv.html">Frühere Runden</a>
      <p id="status" class="status"></p>
    </footer>
  </form>

  <script type="module" src="einrichtung.js"></script>
</body>
</html>
