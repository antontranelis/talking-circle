<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Redekreis</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2712%27 fill=%27none%27 stroke=%27%23e5a05c%27 stroke-width=%273%27/%3E%3Ccircle cx=%2716%27 cy=%274%27 r=%274%27 fill=%27%23e5a05c%27/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="seite-kreis ansicht-kreis">
  <header class="kopf">
    <h1 id="kopf-titel">Redekreis</h1>

    <!-- Am Telefon schaltet die Pille zwischen zwei Vollansichten. -->
    <div class="pille-zeile">
      <div id="ansicht" class="pille" role="tablist" aria-label="Ansicht">
        <button id="tab-kreis" type="button" role="tab" aria-selected="true">Kreis</button>
        <button id="tab-text" type="button" role="tab" aria-selected="false">Text</button>
      </div>
    </div>

    <div class="kopf-rechts">
      <form id="beitritt" class="beitritt" autocomplete="off">
        <input id="beitritt-name" type="text" maxlength="60" placeholder="Dein Name" aria-label="Dein Name" />
        <button class="btn" type="submit">Beitreten</button>
        <button id="beitritt-ab" class="btn still" type="button" hidden>Abbrechen</button>
      </form>
      <button id="noch-jemand" class="btn still" type="button" hidden>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
        Noch jemand an diesem Gerät
      </button>
      <span class="trenner"></span>
      <button id="mehr" class="btn stark" type="button" aria-haspopup="true" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9" /><circle cx="12" cy="12" r="1.9" /><circle cx="19" cy="12" r="1.9" /></svg>
        Mehr
      </button>
    </div>
  </header>

  <div id="menue" class="menue" role="menu" hidden>
    <a href="/einrichtung.html" role="menuitem">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3.2" /><path d="M12 2.8v2.4M12 18.8v2.4M4.5 7.5l2 1.2M17.5 15.3l2 1.2M4.5 16.5l2-1.2M17.5 8.7l2-1.2" /></svg>
      Einstellungen
    </a>
    <button id="export" type="button" role="menuitem">Protokoll laden<span class="hinweis">Markdown</span></button>
    <a href="/archiv.html" role="menuitem">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V5h5v2M6.5 7l1 13h9l1-13" /></svg>
      Archiv
    </a>
    <span class="strich"></span>
    <button id="fokus" type="button" role="menuitem">Nur Sprecher<span class="hinweis">Fokus</span></button>
    <button id="vollbild" type="button" role="menuitem">Vollbild<span class="hinweis">F</span></button>
    <span class="strich"></span>
    <button id="neu" class="rot" type="button" role="menuitem">Neue Runde beginnen</button>
  </div>

  <main class="tafel">
    <section class="kreisspalte">
      <div id="runde" class="ring" aria-label="Der Kreis"></div>

      <div class="steuerung">
        <div id="zeitstrahl" class="zeitstrahl" role="progressbar" aria-label="Redezeit">
          <div class="zeitzeile">
            <span id="uhr">00:00</span>
            <span id="uhr-grenze" class="grenze"></span>
          </div>
          <div class="balken"><i id="balken"></i></div>
        </div>

        <div class="griffe">
          <button id="beenden" class="griff" type="button" aria-label="Beitrag beenden" title="Beitrag beenden — Esc">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="4.5" y="4.5" width="15" height="15" rx="2.6" /></svg>
          </button>
          <button id="pause" class="griff" type="button" aria-label="Pause" title="Pause — Aufnahme und Uhr anhalten">
            <svg id="ikon-pause" width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4.2" height="14" rx="1.4" /><rect x="13.3" y="5" width="4.2" height="14" rx="1.4" /></svg>
            <svg id="ikon-play" width="19" height="19" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M8 5.2 L19 12 L8 18.8 Z" /></svg>
          </button>
          <button id="weiter" class="griff prim" type="button" aria-label="Redestab weitergeben" title="Redestab weitergeben — Leertaste">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M5 5 L16 12 L5 19 Z" /><rect x="17.4" y="4.6" width="3.2" height="14.8" rx="1.4" /></svg>
          </button>
        </div>
      </div>
    </section>

    <aside class="verlauf">
      <div class="verlauf-kopf">
        <h2>Verlauf</h2>
        <span id="anzahl" class="anzahl"></span>
      </div>
      <div class="verlauf-feld">
        <button id="stift" class="btn stift" type="button" title="Protokoll bearbeiten — kommt noch" disabled>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10-4-4L4 16z" /><path d="M14.5 5.5 18.5 9.5" /></svg>
        </button>
        <div class="verlauf-schleier"></div>
        <ol id="beitraege"></ol>
      </div>
    </aside>
  </main>

  <button id="aufnahme" class="rec-griff" type="button" title="Hier aufnehmen" aria-label="Hier aufnehmen"><i></i></button>
  <span id="status" class="status"></span>

  <script type="module" src="kreis.js"></script>
</body>
</html>
