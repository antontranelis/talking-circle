<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2712%27 fill=%27none%27 stroke=%27%23e5a05c%27 stroke-width=%273%27/%3E%3Ccircle cx=%2716%27 cy=%274%27 r=%274%27 fill=%27%23e5a05c%27/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
  <title>Redekreis · Archiv</title>
</head>
<body class="seite-archiv">
  <header class="kopf">
    <div class="kopf-links">
      <h1>Archiv</h1>
      <span id="anzahl" class="modell"></span>
    </div>
    <div class="kopf-rechts">
      <button id="papierkorb-an" class="klein" type="button">Papierkorb</button>
      <a class="klein" href="/">Zurück zum Kreis</a>
    </div>
  </header>

  <main class="tafel">
    <section class="verlauf">
      <h2 id="listen-titel">Runden</h2>
      <ol id="runden"></ol>
    </section>

    <section class="buehne lesen">
      <div class="buehne-kopf">
        <span id="gelesen-titel" class="sprecher still">Keine Runde gewählt</span>
        <span id="gelesen-zeit" class="uhr"></span>
        <div id="werkzeuge" class="werkzeuge" hidden>
          <button id="bearbeiten" class="klein" type="button">Bearbeiten</button>
          <button id="umbenennen" class="klein" type="button">Umbenennen</button>
          <button id="verlauf-an" class="klein" type="button">Verlauf</button>
          <button id="loeschen" class="klein" type="button">Löschen</button>
          <a id="laden" class="klein" href="#">Laden</a>
        </div>
        <div id="werkzeuge-papierkorb" class="werkzeuge" hidden>
          <button id="zurueckholen" class="klein" type="button">Wiederherstellen</button>
        </div>
      </div>

      <p id="meldung" class="status" hidden></p>

      <div id="gelesen" class="gelesen"></div>

      <div id="werkstatt" class="werkstatt" hidden>
        <p class="hinweis-text">
          Überschriften der Form <code>## Name · 14:37</code> trennen die Beiträge. Eine neue Überschrift
          teilt einen Block auf — so kommt ein vergessener Sprecher nachträglich zu seinem Beitrag.
        </p>
        <textarea id="editor" spellcheck="false"></textarea>
        <div class="werkstatt-fuss">
          <button id="speichern" class="gross" type="button">Speichern</button>
          <button id="abbrechen" class="klein" type="button">Abbrechen</button>
          <span id="editor-status" class="status"></span>
        </div>
      </div>

      <div id="verlauf-blatt" class="verlauf-blatt" hidden>
        <h2>Änderungen</h2>
        <ol id="schritte"></ol>
      </div>
    </section>
  </main>

  <script type="module" src="archiv.js"></script>
</body>
</html>
