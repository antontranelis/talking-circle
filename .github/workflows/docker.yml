name: Test und Abbild

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  MODELL: nemotron-3.5-asr-streaming-0.6b-Q8_0.gguf
  MODELL_REPO: handy-computer/nemotron-3.5-asr-streaming-0.6b-gguf

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Rund 700 MB — nach dem ersten Lauf kommt das Modell aus dem Cache.
      - name: Sprachmodell bereitstellen
        uses: actions/cache@v4
        id: modell-cache
        with:
          path: modelle
          key: modell-${{ env.MODELL }}
      - if: steps.modell-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p modelle
          curl -fL --retry 3 -o "modelle/${MODELL}" \
            "https://huggingface.co/${MODELL_REPO}/resolve/main/${MODELL}?download=true"

      - run: npm ci
      - run: npm test
        env:
          TALKING_CIRCLE_MODEL: ${{ github.workspace }}/modelle/${{ env.MODELL }}

  abbild:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Erst probeweise bauen und wirklich starten. Die Tests laufen gegen den
      # Quellbaum — ob im Abbild alle Dateien liegen, zeigt nur ein Start.
      - name: Abbild probeweise bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: talking-circle:probe
          cache-from: type=gha
      - name: Abbild startet
        run: |
          ausgabe=$(docker run --rm -e TALKING_CIRCLE_MODEL=/gibtesnicht.gguf talking-circle:probe 2>&1 || true)
          echo "$ausgabe"
          if ! grep -q "TALKING_CIRCLE_MODEL zeigt ins Leere" <<<"$ausgabe"; then
            echo "::error::Das Abbild startet nicht sauber — vermutlich fehlt eine Datei im Dockerfile."
            exit 1
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
